<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ลำผักชีศิลป์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fafaf9; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-sm bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-stone-100 text-center">
        <h1 class="text-3xl font-bold text-amber-800 mb-2">ลำผักชีศิลป์</h1>
        <p class="text-stone-500 text-sm mb-8 italic">"กรุณากรอกรหัสผ่านเพื่อเข้าชมเว็บไซต์"</p>

        <div class="space-y-4">
            <input type="password" id="password-input" placeholder="รหัสผ่าน" 
                class="w-full px-6 py-4 rounded-full border border-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600 text-center text-lg transition-all">
            <button onclick="checkLogin()" 
                class="w-full bg-amber-800 text-white py-4 rounded-full font-semibold hover:bg-amber-900 transition-all shadow-lg active:scale-95">
                ตกลง
            </button>
        </div>
        <p id="error-msg" class="text-red-500 text-sm mt-6 hidden">❌ รหัสผ่านไม่ถูกต้อง</p>
    </div>

    <script>
        const MY_PASSWORD = "242526"; // *** เปลี่ยนรหัสตรงนี้ ***

        function checkLogin() {
            const input = document.getElementById('password-input').value;
            if (input === MY_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('password-input').value = '';
            }
        }
    </script>
</body>
</html>
