<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ลำผักชีศิลป์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #fafaf9; /* สีน้ำตาลนวล Stone-50 ให้เข้ากับหน้าอื่นๆ */
        }
    </style>
</head>
<body class="flex items-center justify-center min-height-screen p-4" style="min-height: 100vh;">

    <div class="w-full max-w-sm bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-stone-100 text-center">
        <!-- โลโก้หรือชื่อวง -->
        <h1 class="text-3xl font-bold text-amber-800 mb-2">ลำผักชีศิลป์</h1>
        <p class="text-stone-500 text-sm mb-8 italic">"กรุณากรอกรหัสผ่านเพื่อเข้าชมเว็บไซต์"</p>

        <!-- ฟอร์มกรอกรหัส -->
        <div class="space-y-4">
            <input type="password" id="password-input" placeholder="รหัสผ่าน" 
                class="w-full px-6 py-4 rounded-full border border-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600 text-center text-lg transition-all">
            
            <button onclick="checkLogin()" 
                class="w-full bg-amber-800 text-white py-4 rounded-full font-semibold hover:bg-amber-900 transition-all shadow-lg active:scale-95">
                ตกลง
            </button>
        </div>

        <!-- ข้อความแจ้งเตือนรหัสผิด -->
        <p id="error-msg" class="text-red-500 text-sm mt-6 hidden">❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</p>
    </div>

    <script>
        // กำหนดรหัสผ่านที่คุณต้องการที่นี่
        const MY_PASSWORD = "242526"; 

        function checkLogin() {
            const input = document.getElementById('password-input').value;
            const error = document.getElementById('error-msg');

            if (input === MY_PASSWORD) {
                // เก็บสถานะ Login ใน Session (หายไปเมื่อปิดเบราว์เซอร์)
                sessionStorage.setItem('isLoggedIn', 'true');
                // ไปยังหน้าแรก
                window.location.href = 'index.html';
            } else {
                error.classList.remove('hidden');
                // ล้างค่าในช่องกรอก
                document.getElementById('password-input').value = '';
            }
        }

        // กด Enter เพื่อเข้าสู่ระบบได้
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });
    </script>

</body>
</html>
