<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลำผักชีศิลป์ - หน้าแรก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #fafaf9; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .text-shadow { text-shadow: 2px 2px 8px rgba(0,0,0,0.6); }
        .gradient-text {
            background: linear-gradient(to right, #92400e, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-stone-800">

    <!-- Navigation -->
    <nav class="p-3 md:p-4 bg-white/90 backdrop-blur-md flex justify-between items-center sticky top-0 z-50 border-b border-stone-200">
        <div class="flex items-center gap-2">
            <h1 class="text-lg md:text-xl font-bold text-amber-800">ลำผักชีศิลป์</h1>
        </div>
        <div class="space-x-4 md:space-x-6 text-xs md:text-sm font-medium">
            <a href="index.html" class="text-amber-600 border-b-2 border-amber-600 pb-1">หน้าแรก</a>
            <a href="about.html" class="hover:text-amber-600 transition">ประวัติวง</a>
        </div>
    </nav>

    <!-- Hero Section: พื้นหลังรูปภาพ -->
    <header class="relative h-[400px] md:h-[600px] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="images/Black Gold.png" alt="Background" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-stone-900/50"></div>
        </div>
        <div class="relative z-10 text-center px-4">
            <h2 class="text-4xl md:text-9xl font-bold mb-4 text-white text-shadow tracking-tighter">
                ลำผักชีศิลป์
            </h2>
            <p class="text-base md:text-3xl text-stone-200 italic font-light drop-shadow-md mb-8">
                "สืบสานดนตรีไทย ด้วยหัวใจคนรุ่นใหม่"
            </p>
            <a href="about.html" class="inline-block bg-amber-700 text-white px-8 py-3 md:px-12 md:py-4 rounded-full text-sm md:text-lg font-semibold hover:bg-amber-800 transition-all shadow-xl">
                ทำความรู้จักพวกเรา
            </a>
        </div>
    </header>

    <!-- Welcome Section -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 py-12 md:py-24 text-center">
        <h3 class="text-2xl md:text-4xl font-bold mb-6 md:mb-10 text-stone-800">ยินดีต้อนรับ</h3>
        <p class="text-base md:text-xl text-stone-600 leading-relaxed max-w-2xl mx-auto">
            นักดนตรีของโรงเรียนลำผักชีจากใจของลำผักชีศีลป์จุดเริ่มต้นของวงกดได้ที่ด้านล่าง
        </p>
    </main>

    <!-- Footer -->
    <footer class="py-8 md:py-12 bg-[#1c1917] text-stone-500 text-center text-[10px] md:text-sm">
        <p>© 2026 ลำผักชีศิลป์ - All Rights Reserved</p>
    </footer>

</body>
</html>
