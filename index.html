<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลำผักชีศิลป์ - หน้าแรก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* บังคับให้พื้นหลังสีนวลแผ่เต็มหน้าจอตั้งแต่บนสุดจนถึงล่างสุด */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #fafaf9; /* สีน้ำตาลนวล Stone-50 */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* ตัวอักษรไล่เฉดสีน้ำตาลทอง */
        .gradient-text {
            background: linear-gradient(to right, #92400e, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* ให้ส่วนเนื้อหาขยายพื้นที่เพื่อดัน Footer ลงไปข้างล่างสุด */
        main {
            flex: 1;
        }
    </style>
</head>
<body class="text-stone-800">

    <!-- Navigation Bar -->
    <nav class="p-4 bg-white/80 backdrop-blur-md flex justify-between items-center sticky top-0 z-50 border-b border-stone-200">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-amber-800">ลำผักชีศิลป์</h1>
        </div>
        <div class="space-x-6 text-sm font-medium">
            <a href="index.html" class="text-amber-600 border-b-2 border-amber-600 pb-1">หน้าแรก</a>
            <a href="about.html" class="hover:text-amber-600 transition">ประวัติวง</a>
        </div>
    </nav>

    <!-- Header Section (ไม่มีรูปภาพแล้ว) -->
    <header class="relative h-[500px] flex items-center justify-center overflow-hidden">
        <!-- ใส่รูปภาพพื้นหลังตรงนี้ -->
        <div class="absolute inset-0 z-0">
            <!-- เปลี่ยน path รูปภาพให้ตรงกับที่คุณต้องการใช้เป็นพื้นหลัง -->
            <img src="images/Black Gold.png" alt="Background" class="w-full h-full object-cover">
            <!-- ตัวกรองสี (Overlay) เพื่อให้ข้อความอ่านง่ายขึ้น -->
            <div class="absolute inset-0 bg-stone-900/40"></div>
        </div>

        <!-- ข้อความที่วางทับบนรูปภาพ -->
        <div class="relative z-10 text-center px-5">
            <!-- ถ้าพื้นหลังเข้ม ให้เปลี่ยน gradient-text เป็น text-white หรือโทนสว่าง -->
            <h2 class="text-6xl md:text-9xl font-bold mb-6 text-white drop-shadow-2xl tracking-tighter">
                ลำผักชีศิลป์
            </h2>
            <p class="text-xl md:text-3xl text-stone-100 italic font-light drop-shadow-lg">
                "สืบสานดนตรีไทย ด้วยหัวใจคนรุ่นใหม่"
            </p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-5 py-12 text-center">
        <div class="border-t border-stone-200 pt-16">
            <h3 class="text-3xl font-bold mb-8 text-stone-800">ยินดีต้อนรับ</h3>
            <p class="text-lg text-stone-600 leading-relaxed max-w-2xl mx-auto mb-12">
                นักดนตรีของโรงเรียนลำผักชีจากใจของลำผักชีศีลป์จุดเริ่มต้นของวงกดได้ที่ด้านล่าง
            </p>
            <a href="about.html" class="inline-block bg-amber-800 text-white px-10 py-4 rounded-full text-lg font-semibold hover:bg-amber-900 transition-all shadow-lg">
                อ่านประวัติวงเพิ่มเติม
            </a>
        </div>
    </main>

    <!-- Footer สีเข้มติดขอบล่างสุด -->
    <footer class="py-12 bg-[#1c1917] text-stone-500 text-center text-sm">
        <p>© 2026 ลำผักชีศิลป์ - All Rights Reserved</p>
    </footer>

</body>
</html>
